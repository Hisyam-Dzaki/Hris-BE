version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hris_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-hris_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hris_secret_2026}
      POSTGRES_DB: ${DB_NAME:-hris_db}
    volumes:
      - hris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hris_admin} -d ${DB_NAME:-hris_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hris_pgdata:
